name: linguachat
description: "WorldPals - Yabancı Dil Öğrenme & Mesajlaşma Uygulaması"
publish_to: 'none'
version: 1.1.0+32

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  provider: ^6.1.2
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.19.0
  uuid: ^4.5.1
  timeago: ^3.7.0
  translator: ^1.0.4+1
  permission_handler: ^11.3.1
  hmssdk_flutter: ^1.11.0
  cloud_functions: ^5.6.2
  http: ^1.6.0
  dart_jsonwebtoken: ^3.4.0
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^21.0.0
  onesignal_flutter: ^5.5.1
  purchases_flutter: ^9.16.1
  flutter_dotenv: ^5.1.0
  google_mobile_ads: ^8.0.0
  url_launcher: ^6.3.2
  share_plus: ^13.1.0
  app_tracking_transparency: ^2.0.6+1
  flutter_fortune_wheel: ^1.3.2
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter_native_splash:
  color: "#111116"
  android: true
  ios: true
  android_12:
    color: "#111116"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
